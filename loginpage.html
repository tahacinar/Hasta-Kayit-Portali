<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Hasta Portal</title>
    <!-- Tailwind CSS Kütüphanesi -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Özel Stil Dosyası -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-full font-sans antialiased text-slate-800">
    
    <!-- ========================================== -->
    <!-- GİRİŞ SAYFASI ANA SAYFASI                -->
    <!-- ========================================== -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-900 via-blue-700 to-indigo-800 relative overflow-hidden">
        
        <!-- Arka Plan Dekoratif Işık Efektleri -->
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        
        <!-- ========================================== -->
        <!-- GİRİŞ KARTI (FORM KUTUSU)                   -->
        <!-- ========================================== -->
        <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 sm:p-10 z-10 fade-in border border-blue-50">
            
            <!-- Kart Başlığı ve İkonu -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-2xl text-blue-600 mb-4 shadow-sm">
                    <i class="fa-solid fa-user-shield text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Hoş Geldiniz</h1>
                <p class="text-sm text-slate-500 mt-1">Devam etmek için hesabınıza giriş yapın</p>
            </div>

            <!-- Genel Hata/Başarı Mesaj Kutusu (JS ile yönetilir) -->
            <div id="messageBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium transition-all duration-300"></div>

            <!-- ========================================== -->
            <!-- GİRİŞ FORMU                                -->
            <!-- ========================================== -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5" novalidate>
                
                <!-- E-Posta Alanı -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">E-Posta Adresi</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <input type="email" id="email" class="custom-input w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition duration-200 text-sm" placeholder="ornek@domain.com">
                    </div>
                    <!-- E-Posta Hata Mesajı -->
                    <p id="emailError" class="hidden mt-1.5 text-xs font-medium text-rose-600 flex items-center gap-1">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span id="emailErrorText">E-posta alanı boş bırakılamaz!</span>
                    </p>
                </div>

                <!-- Şifre Alanı -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Şifre</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="password" class="custom-input w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition duration-200 text-sm" placeholder="••••••••">
                        <!-- Şifre Göster/Gizle Butonu -->
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                            <i id="passwordToggleIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <!-- Şifre Hata Mesajı -->
                    <p id="passwordError" class="hidden mt-1.5 text-xs font-medium text-rose-600 flex items-center gap-1">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span id="passwordErrorText">Şifre alanı boş bırakılamaz!</span>
                    </p>
                </div>

                <!-- Beni Hatırla ve Şifremi Unuttum Bağlantısı -->
                <div class="flex items-center justify-between text-xs sm:text-sm">
                    <label class="flex items-center gap-2 cursor-pointer select-none text-slate-600 hover:text-slate-800">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 transition cursor-pointer">
                        <span>Beni Hatırla</span>
                    </label>
                    <button type="button" onclick="openForgotPasswordModal()" class="text-blue-600 hover:text-blue-700 font-semibold transition hover:underline">
                        Şifremi Unuttum?
                    </button>
                </div>

                <!-- Giriş Yap Gönder Butonu -->
                <button type="submit" id="submitBtn" class="btn-primary w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/30 transition duration-200 flex items-center justify-center gap-2">
                    <span>Giriş Yap</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Test/Demo Kullanıcı Bilgi Alanı -->
            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-400">Test Bilgisi:</p>
                <p class="text-xs font-mono text-slate-600 mt-1">tahacinar@outlook.com.tr</p>
                <p class="text-xs font-mono text-slate-600 mt-1">a80556a9b22Fd</p>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ŞİFREMİ UNUTTUM (Penceresi)          -->
    <!-- ========================================== -->
    <div id="forgotPasswordModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 fade-in">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 sm:p-8 shadow-2xl relative border border-slate-100">
            
            <!-- Şifremi Unuttum Alanı Kapatma Çarpı Butonu -->
            <button onclick="closeForgotPasswordModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-2 rounded-lg transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <!-- Başlık ve İkonu -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-50 text-blue-600 rounded-xl mb-3">
                    <i class="fa-solid fa-key text-xl"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-900">Şifrenizi mi Unuttunuz?</h3>
                <p class="text-xs text-slate-500 mt-1">E-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim.</p>
            </div>

            <!-- Şifre Sıfırlama Formu -->
            <form onsubmit="handleResetPassword(event)" class="space-y-4" novalidate>
                <div>
                    <label for="resetEmail" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">E-Posta Adresi</label>
                    <input type="email" id="resetEmail" class="custom-input w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="tahacinar@outlook.com.tr">
                    <p id="resetEmailError" class="hidden mt-1.5 text-xs font-medium text-rose-600 flex items-center gap-1">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span id="resetEmailErrorText">E-posta alanı boş bırakılamaz!</span>
                    </p>
                </div>

                <!-- Sıfırlama İşlem Mesajı Alanı -->
                <div id="resetMessage" class="hidden p-3 rounded-lg text-xs font-medium"></div>

                <!-- İşlem Butonları (İptal ve Gönder) -->
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeForgotPasswordModal()" class="w-1/2 py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition text-sm">İptal</button>
                    <button type="submit" id="resetBtn" class="btn-primary w-1/2 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md text-sm">Bağlantı Gönder</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Kimlik / Oturum Yönetimi Scripti -->
    <script src="auth.js"></script>
</body>
</html>
